type: services
version: 1.0.0
name: Services Block
description: Блок с услугами/сервисами в виде карточек
category: content
is_active: true
preview: /previews/blocks/services.png

schema:
  title:
    type: string
    required: true
    default: Наши услуги
    description: Заголовок блока
  subtitle:
    type: string
    required: false
    default: Что мы предлагаем
    description: Подзаголовок блока
  columns:
    type: integer
    minimum: 1
    maximum: 4
    default: 3
    description: Количество колонок
  items:
    type: array
    required: true
    description: Список услуг
    items:
      type: object
      properties:
        title:
          type: string
          required: true
          description: Название услуги
        description:
          type: string
          required: true
          description: Описание услуги
        icon:
          type: string
          required: false
          description: Иконка (URL или emoji)
        image:
          type: string
          format: url
          required: false
          description: Изображение услуги

defaults:
  title: Наши услуги
  subtitle: Что мы предлагаем
  columns: 3
  items:
    - title: Услуга 1
      description: Описание услуги
      icon: '🎯'
      image: ''
    - title: Услуга 2
      description: Описание услуги
      icon: '💼'
      image: ''
    - title: Услуга 3
      description: Описание услуги
      icon: '🚀'
      image: ''

